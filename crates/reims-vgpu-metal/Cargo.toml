[package]
name = "reims-vgpu-metal"
description = "The Platform implementation over Metal, IOSurface and mach_vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Metal, IOSurface and Mach VM are macOS's: elsewhere the crate is empty (`lib.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
reims-vgpu-core.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
objc2-io-surface.workspace = true
block2.workspace = true
dispatch2.workspace = true
mach2.workspace = true
libc.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
reims-vgpu-core = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
